# AVENGE — Core Analytics Stack
#
# Services:
#   mosquitto   MQTT broker  (1883 on $MQTT_BIND, auth + ACL required)
#   clickhouse  Time-series DB (8123 HTTP, 9000 native — localhost only)
#   telegraf    MQTT -> ClickHouse bridge (no exposed ports)
#   grafana     Dashboards (no published port — reached via caddy)
#   caddy       Local reverse proxy: http://grafana.localhost (localhost:80)
#   preflight, clickhouse-init   one-shot helpers (exit after running)
#
# Data flow:
#   edge-filter -> MQTT(mosquitto) -> Telegraf -> ClickHouse -> Grafana
#
# Start (first time and every time after):
#   cp .env.example .env     # then set every password in .env
#   docker compose up -d
# Everything else is automatic and ordered by depends_on:
#   preflight       rejects missing / placeholder / non-alphanumeric passwords
#   mosquitto       builds its password file from .env at every start
#   clickhouse-init applies the schema once ClickHouse is healthy (idempotent)
#   telegraf, grafana start after the schema exists
# Change a password: edit .env, run `docker compose up -d` (details: ../docs/OPERATIONS.md).
#
# Stop:   docker compose down        (use -v to also wipe ClickHouse data)
# Logs:   docker compose logs -f telegraf

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  iot:
    driver: bridge
  proxy:
    driver: bridge

volumes:
  clickhouse-data:
  grafana-data:
  mosquitto-data:
  caddy-data:
  caddy-config:

services:

  # ── Preflight: fail fast on bad credentials ────────────────────────────
  preflight:
    image: alpine:3.20
    container_name: sm_preflight
    restart: "no"
    network_mode: none
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set}
      CLICKHOUSE_TELEGRAF_PASSWORD: ${CLICKHOUSE_TELEGRAF_PASSWORD:?CLICKHOUSE_TELEGRAF_PASSWORD is not set}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?CLICKHOUSE_GRAFANA_PASSWORD is not set}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD:?MQTT_EDGE_PASSWORD is not set}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:?MQTT_TELEGRAF_PASSWORD is not set}
    command:
      - sh
      - -c
      - |
        bad=0
        for v in CLICKHOUSE_PASSWORD CLICKHOUSE_TELEGRAF_PASSWORD CLICKHOUSE_GRAFANA_PASSWORD GRAFANA_ADMIN_PASSWORD MQTT_EDGE_PASSWORD MQTT_TELEGRAF_PASSWORD; do
          val=$$(printenv "$$v")
          case "$$val" in
            changeme) echo "ERROR: $$v is still the placeholder 'changeme' - set a real password in core/.env"; bad=1 ;;
            *[!A-Za-z0-9]*) echo "ERROR: $$v must contain only letters and digits"; bad=1 ;;
          esac
        done
        exit $$bad

  # ── MQTT Broker ────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sm_mosquitto
    restart: unless-stopped
    logging: *default-logging
    networks: [iot]
    depends_on:
      preflight:
        condition: service_completed_successfully
    ports:
      # MQTT (plaintext — PoC only). MQTT_BIND defaults to localhost; set it to
      # the LAN IP of this machine so the edge device can connect.
      - "${MQTT_BIND:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    environment:
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD:?MQTT_EDGE_PASSWORD is not set}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:?MQTT_TELEGRAF_PASSWORD is not set}
    # The password file is rebuilt from the environment on every start, so
    # editing .env and running `docker compose up -d` is all a change needs.
    command:
      - sh
      - -c
      - |
        set -e
        mosquitto_passwd -c -b /mosquitto/config/passwd edge "$$MQTT_EDGE_PASSWORD"
        mosquitto_passwd -b /mosquitto/config/passwd telegraf "$$MQTT_TELEGRAF_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd 2>/dev/null || true
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u telegraf -P \"$$MQTT_TELEGRAF_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 2"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── ClickHouse ─────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sm_clickhouse
    restart: unless-stopped
    logging: *default-logging
    networks: [iot]
    depends_on:
      preflight:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8123:8123"   # HTTP (Grafana + Telegraf use the iot network)
      - "127.0.0.1:9000:9000"   # Native TCP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Service accounts (telegraf: INSERT only, grafana: read-only).
      - ./clickhouse/users.d/avenge-users.xml:/etc/clickhouse-server/users.d/avenge-users.xml:ro
      # NOTE: init.sql is intentionally NOT mounted to
      # docker-entrypoint-initdb.d (double-process startup bug in the
      # 24.3-alpine image). The clickhouse-init service applies it instead.
    environment:
      # Admin account — manual work and schema setup only.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set}
      # Read by clickhouse/users.d/avenge-users.xml.
      CH_TELEGRAF_PASSWORD: ${CLICKHOUSE_TELEGRAF_PASSWORD:?CLICKHOUSE_TELEGRAF_PASSWORD is not set}
      CH_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?CLICKHOUSE_GRAFANA_PASSWORD is not set}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Use 127.0.0.1, not localhost — Alpine resolves localhost to ::1
      # (IPv6) first, but ClickHouse's HTTP server binds 127.0.0.1 (IPv4).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Schema (one-shot, idempotent) ──────────────────────────────────────
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sm_clickhouse_init
    restart: "no"
    networks: [iot]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/init.sql:/init.sql:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        ch() { clickhouse-client --host clickhouse --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" "$$@"; }
        ch --query "CREATE DATABASE IF NOT EXISTS iot"
        ch --multiquery < /init.sql
        echo "schema applied"

  # ── Telegraf (MQTT subscriber → ClickHouse writer) ─────────────────────
  telegraf:
    image: telegraf:1.30-alpine
    container_name: sm_telegraf
    restart: unless-stopped
    logging: *default-logging
    networks: [iot]
    depends_on:
      mosquitto:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      MQTT_BROKER: "tcp://mosquitto:1883"
      MQTT_USER: telegraf
      MQTT_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:?MQTT_TELEGRAF_PASSWORD is not set}
      CLICKHOUSE_USER: telegraf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_TELEGRAF_PASSWORD:?CLICKHOUSE_TELEGRAF_PASSWORD is not set}

  # ── Grafana ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: sm_grafana
    restart: unless-stopped
    logging: *default-logging
    networks: [iot, proxy]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The ClickHouse datasource plugin is vendored in ./grafana/plugins
      # (committed to the repo) instead of GF_INSTALL_PLUGINS, so the stack
      # starts without reaching grafana.com.
      - ./grafana/plugins:/var/lib/grafana/plugins:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://grafana.localhost"
      # Required so provisioning/datasources/clickhouse.yaml can substitute
      # ${CLICKHOUSE_PASSWORD} — Grafana expands env vars in provisioning
      # files against its own process environment, not the host's.
      CLICKHOUSE_USER: grafana
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?CLICKHOUSE_GRAFANA_PASSWORD is not set}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Local reverse proxy ────────────────────────────────────────────────
  caddy:
    image: caddy:2
    container_name: sm_caddy
    restart: unless-stopped
    logging: *default-logging
    networks: [proxy]
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      grafana:
        condition: service_healthy
