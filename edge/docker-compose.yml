# AVENGE — Edge Engine (Raspberry Pi)
#
# Runs the edge-filter Go binary in a container on the Pi.
# All config comes from edge/.env — no hardcoded values here.
#
# Prerequisites:
#   1. Image is published by the Release workflow (push a v*.*.* tag).
#      The ghcr.io package must be public, or run `docker login ghcr.io`
#      on the Pi.
#   2. Copy edge/.env.example to edge/.env and fill it in.
#   3. Find the dialout GID on the Pi:  getent group dialout
#      and set DIALOUT_GID in edge/.env.
#   4. On the Pi: docker compose -f edge/docker-compose.yml up -d
#
# Exactly one serial device is passed through: SERIAL_PORT.
# SERIAL_INTERFACE (usb | rs485) only selects the baud-rate handling.
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f avenge-edge
# Stop:   docker compose down

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  avenge-edge:
    image: ghcr.io/casablanque-code/avenge-edge:${AVENGE_EDGE_TAG:-latest}
    container_name: avenge_edge
    restart: unless-stopped
    logging: *default-logging

    devices:
      - "${SERIAL_PORT:-/dev/ttyACM0}:${SERIAL_PORT:-/dev/ttyACM0}"

    # The image runs as nonroot (uid 65532). Serial nodes are root:dialout
    # (mode 660), so add the host's numeric dialout GID. A group name does
    # not work here: distroless has no /etc/group entry for it.
    group_add:
      - "${DIALOUT_GID:?Set DIALOUT_GID in .env (run: getent group dialout)}"

    environment:
      SERIAL_INTERFACE: ${SERIAL_INTERFACE:?Set SERIAL_INTERFACE=usb or rs485 in .env}
      USB_PORT:    ${SERIAL_PORT:-/dev/ttyACM0}
      RS485_PORT:  ${SERIAL_PORT:-/dev/ttyUSB0}
      RS485_BAUD:  ${RS485_BAUD:-230400}

      SENSOR_ID:          ${SENSOR_ID:-bearing_01}
      SENSOR_SAMPLE_RATE: ${SENSOR_SAMPLE_RATE:-1600}

      # Core stack — read by the binary (defaultBroker in main.go).
      CENTRAL_HOST: ${CENTRAL_HOST:?Set CENTRAL_HOST in .env}
      MQTT_PORT:    ${MQTT_PORT:-1883}
      MQTT_USER:     ${MQTT_USER:-edge}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}

    # No healthcheck: the distroless image has no shell or pgrep.
    # Use `restart: unless-stopped` and `docker compose logs`.
