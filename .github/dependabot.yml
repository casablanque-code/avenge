version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot keeps the SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images of the edge Dockerfile (Go toolchain, distroless).
  - package-ecosystem: docker
    directory: /edge
    schedule:
      interval: weekly

  # Images of the core stack (ClickHouse, Mosquitto, Grafana, Telegraf, Caddy,
  # Alpine). The e2e job is the safety net that makes these bumps reviewable.
  - package-ecosystem: docker-compose
    directory: /core
    schedule:
      interval: weekly

  # Mermaid and jsdom, used only by the docs diagram check in CI.
  - package-ecosystem: npm
    directory: /tests/lint/mermaid
    schedule:
      interval: weekly
