name: Docs

# CI skips pushes to main that only touch Markdown or docs/. This workflow
# runs the repository checks for exactly those pushes, so a broken CHANGELOG
# or a dead link cannot sit on main until the day somebody tags a release.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  repo-checks:
    name: repo checks (docs-only push)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repo checks (docs paths and links, CHANGELOG structure)
        run: tests/lint/repo-checks.sh
