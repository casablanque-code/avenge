name: CI

# Runs on every pull request (so the required "ci-ok" check always reports),
# on pushes to main that change more than docs, and when called by the
# Release workflow so a tag can only ship code that passed the same checks.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Floor for total statement coverage of edge/internal/... (percent).
  # Kept slightly below the measured value; raise it when tests improve.
  COVERAGE_MIN: "79.0"

jobs:
  edge:
    name: edge (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # No go.sum: the project has zero external dependencies.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Cross-build for Raspberry Pi (linux/arm64)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/edge-filter

      - name: Tests (race detector, coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          echo "go ${{ matrix.go }}: coverage ${total}% (minimum ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t + 0 >= m + 0) }' \
            || { echo "::error::coverage ${total}% is below the ${COVERAGE_MIN}% floor"; exit 1; }

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  infra:
    name: infra (compose, yaml, docker, workflows, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repo checks (env examples, docs paths and links)
        run: tests/lint/repo-checks.sh

      - name: Compose files resolve
        run: |
          cp core/.env.example core/.env
          docker compose -f core/compose.yaml config -q
          SERIAL_INTERFACE=usb DIALOUT_GID=20 CENTRAL_HOST=10.0.0.1 MQTT_PASSWORD=ci \
            docker compose -f edge/compose.yaml config -q

      - name: yamllint
        run: |
          pip install --quiet yamllint==1.38.0
          yamllint --strict .

      - name: shellcheck
        run: shellcheck tests/lint/*.sh tests/e2e/*.sh

      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < edge/Dockerfile

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Grafana dashboards are valid JSON
        run: |
          for f in core/grafana/provisioning/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

  image:
    name: edge image (build, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: edge
          file: edge/Dockerfile
          load: true
          push: false
          tags: avenge-edge:ci
          cache-from: type=gha,scope=edge-image
          cache-to: type=gha,mode=max,scope=edge-image

      - name: Image runs as non-root
        run: test "$(docker inspect --format '{{.Config.User}}' avenge-edge:ci)" = "nonroot:nonroot"

      - name: Smoke test (replay a seeded signal, no MQTT)
        run: |
          python3 firmware-sim/signal_generator.py --seed 1 batch --samples 20000 --rate 1600 > "$RUNNER_TEMP/in.jsonl"
          docker run --rm -i -e SENSOR_SAMPLE_RATE=1600 avenge-edge:ci --no-mqtt --sensor-id ci \
            < "$RUNNER_TEMP/in.jsonl" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -Eq 'Total samples *: *20000' "$RUNNER_TEMP/out.txt"
          ! grep -q 'DROP' "$RUNNER_TEMP/out.txt"

  e2e:
    name: e2e (full core stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Build edge-filter
        working-directory: edge
        run: go build -o edge-filter ./cmd/edge-filter

      - name: Run end-to-end test
        run: tests/e2e/run.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [edge, vuln, infra, image, e2e, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
