name: Release

# Triggers only on version tags (v1.0.0, v0.2.1, v1.0.0-rc1 ...).
# A tag can only ship code that passed the full CI on the same commit and
# that is already on main.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-tag:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be an ancestor of main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge first, then tag"
            exit 1
          fi

  build-and-push:
    name: Build & push image
    needs: [ci, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "latest" moves only for stable tags; pre-releases (v1.0.0-rc1) keep their own tag.
      - name: Compute image tags
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${REPO_OWNER,,}/avenge-edge"
          tags="${image}:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="${tags}"$'\n'"${image}:latest" ;;
          esac
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: edge
          file: edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=edge-image
          cache-to: type=gha,mode=max,scope=edge-image

  github-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history needed for changelog generation
          persist-credentials: false

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Image: `ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ github.ref_name }}`

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ github.ref_name }}
            ```
