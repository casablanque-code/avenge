name: Release

# Triggers only on version tags (v1.0.0, v0.2.1, v1.0.0-rc1 ...).
# A tag can only ship code that passed the full CI on the same commit and
# that is already on main.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-tag:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be an ancestor of main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge first, then tag"
            exit 1
          fi

  build-and-push:
    name: Build & push image
    needs: [ci, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "latest" moves only for stable tags; pre-releases (v1.0.0-rc1) keep their own tag.
      - name: Compute image tags
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${REPO_OWNER,,}/avenge-edge"
          tags="${image}:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="${tags}"$'\n'"${image}:latest" ;;
          esac
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: edge
          file: edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=edge-image
          cache-to: type=gha,mode=max,scope=edge-image

  github-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history needed for changelog generation
          persist-credentials: false

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Image: `ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ github.ref_name }}`

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ github.ref_name }}
            ```
