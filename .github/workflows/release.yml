name: Release

# Triggers only on version tags (v1.0.0, v0.2.1, etc).
# Pushing a tag is a deliberate release action — no path filtering needed,
# you decide when to tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write    # for creating the GitHub Release
  packages: write     # for pushing to ghcr.io

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -count=1 -race

  build-and-push:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: edge
          file: edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/avenge-edge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for changelog generation

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ github.ref_name }}`

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/avenge-edge:${{ github.ref_name }}
            ```
